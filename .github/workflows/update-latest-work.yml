name: Update latest work

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Find latest repository
        id: latest
        env:
          GH_TOKEN: ${{ secrets.PROFILE_REPOS_TOKEN || github.token }}
          PROFILE_REPO: ${{ github.event.repository.name }}
        shell: bash
        run: |
          repos="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/user/repos?affiliation=owner&visibility=all&sort=pushed&direction=desc&per_page=100")"

          latest="$(jq -r \
            --arg profile "$PROFILE_REPO" \
            '[.[] | select(.fork == false and .archived == false and .name != $profile)]
             | .[0] | [.name, .html_url] | @tsv' <<< "$repos")"

          if [[ -z "$latest" || "$latest" == $'null\tnull' ]]; then
            echo "No eligible public repository found."
            exit 1
          fi

          IFS=$'\t' read -r name url <<< "$latest"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Check out profile README
        uses: actions/checkout@v4

      - name: Update README
        env:
          LATEST_NAME: ${{ steps.latest.outputs.name }}
          LATEST_URL: ${{ steps.latest.outputs.url }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text()
          replacement = (
              "Latest work: <!-- latest-work-start -->"
              f"[{os.environ['LATEST_NAME']}]({os.environ['LATEST_URL']})"
              "<!-- latest-work-end --><br>"
          )
          updated, count = re.subn(
              r"Latest work: <!-- latest-work-start -->.*?<!-- latest-work-end --><br>",
              replacement,
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Latest work marker not found in README.md")
          path.write_text(updated)
          PY

      - name: Commit latest work
        run: |
          if git diff --quiet -- README.md; then
            echo "Latest work is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update latest work in profile README"
          git push
